<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GX-3R Pro 修復版</title>
    <style>
        body { background: #121212; color: #00ff41; font-family: monospace; padding: 20px; }
        .box { border: 1px solid #333; padding: 10px; margin: 10px; }
    </style>
</head>
<body>
    <h1>儀器連線測試</h1>
    <button id="btn" style="padding:10px;">點擊測試指令</button>
    <div id="log" class="box">等待測試...</div>

<script>
    // 這一版我們徹底簡化指令發送邏輯
    function calculateCheckSum(str) {
        let sum = 0;
        for (let i = 0; i < str.length; i++) sum += str.charCodeAt(i);
        // 理研通常使用 (STX + DATA + ETX) 的總和取後兩位 Hex
        let val = (sum + 0x02 + 0x03) & 0xFF;
        return val.toString(16).toUpperCase().padStart(2, '0');
    }

    document.getElementById('btn').onclick = async () => {
        const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: ['5699d362-0c53-11e7-93ae-92361f002671'] }] });
        const srv = await (await dev.gatt.connect()).getPrimaryService('5699d362-0c53-11e7-93ae-92361f002671');
        const write = await srv.getCharacteristic('5699d772-0c53-11e7-93ae-92361f002671');

        // 嘗試最簡化的讀取指令
        const cmd = "0000DH,R";
        const sum = calculateCheckSum(cmd);
        const packet = new Uint8Array([0x02, ...[...cmd].map(c=>c.charCodeAt(0)), 0x03, ...[...sum].map(c=>c.charCodeAt(0)), 0x04]);
        
        await write.writeValue(packet);
        document.getElementById('log').innerText = "已發送指令，請觀察儀器回傳是否變化";
    };
</script>
</body>
</html>
