<script>
async function handleNotification(event) {
    const value = event.target.value;
    const decoder = new TextDecoder("ascii");
    const textData = decoder.decode(value);
    
    // 檢查回傳是否包含數據 (DH,R)
    if (textData.includes("DH,R")) {
        const parts = textData.split(',');
        // 依照規格書對應位置: [0]為ADD/CH, [1]為COMM, [2]為SUBCOMM, [3]起為數據
        if (parts.length >= 7) {
            document.getElementById("CH4").innerText = parts[3];
            document.getElementById("O2").innerText = parts[4];
            document.getElementById("CO").innerText = parts[5];
            document.getElementById("H2S").innerText = parts[6];
        }
    }
}
</script>
