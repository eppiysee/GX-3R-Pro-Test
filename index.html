<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GX-3R Pro 即時監控</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .card { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .box { padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; background: #0078d7; color: white; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>GX-3R Pro 監控</h2>
    <button onclick="startConnection()">開始連線儀器</button>
    <div id="status" style="margin: 15px; color: #555;">等待中...</div>
    
    <div id="gas-display">
        <div class="data-grid" id="data-container">
            <div class="box">O₂<br><b id="val0">--</b>%</div>
            <div class="box">氣體2<br><b id="val1">--</b></div>
            <div class="box">氣體3<br><b id="val2">--</b></div>
            <div class="box">氣體4<br><b id="val3">--</b></div>
        </div>
        <p id="raw-log" style="font-size: 0.7rem; color: #aaa; margin-top: 20px;"></p>
    </div>
</div>

<script>
    let writeChar;

    async function startConnection() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['5699d362-0c53-11e7-93ae-92361f002671'] }]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('5699d362-0c53-11e7-93ae-92361f002671');
            writeChar = await service.getCharacteristic('5699d772-0c53-11e7-93ae-92361f002671');
            const notifyChar = await service.getCharacteristic('5699d646-0c53-11e7-93ae-92361f002671');

            await notifyChar.startNotifications();
            notifyChar.addEventListener('characteristicvaluechanged', (e) => {
                const raw = new TextDecoder().decode(e.target.value);
                const p = raw.split(',');
                if (p.length >= 7) {
                    document.getElementById('val0').innerText = p[3];
                    document.getElementById('val1').innerText = p[4];
                    document.getElementById('val2').innerText = p[5];
                    document.getElementById('val3').innerText = p[6];
                    document.getElementById('raw-log').innerText = "原始: " + raw;
                }
            });

            setInterval(async () => {
                // 發送標準查詢封包
                const packet = new Uint8Array([0x02, 0x30, 0x30, 0x30, 0x30, 0x44, 0x48, 0x2C, 0x52, 0x03, 0x41, 0x38, 0x04]);
                await writeChar.writeValue(packet);
            }, 2000);

            document.getElementById('status').innerText = "連線成功，監測中...";
        } catch (err) {
            document.getElementById('status').innerText = "連線失敗: " + err.message;
        }
    }
</script>
</body>
</html>
